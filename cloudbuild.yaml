steps:
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: "bash"
    args:
      - "src/scripts/deploy-cloudrun.sh"

  - name: "node:20"
    entrypoint: "bash"
    args:
      - "-c"
      - "npm ci && npm run db:migrate"

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: "bash"
    args:
      - "src/scripts/deploy-firebase-hosting.sh"