name: Deploy Dev

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloud Run and Firebase Hosting (dev)
    runs-on: ubuntu-latest
    environment: dev
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      CLOUD_RUN_SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
      DB_HOST: ${{ vars.DB_HOST }}
      DB_PORT: ${{ vars.DB_PORT }}
      DB_NAME: ${{ vars.DB_NAME }}
      DB_USER: ${{ vars.DB_USER }}
      DB_SSL: ${{ vars.DB_SSL }}
      STORAGE_PROVIDER: ${{ vars.STORAGE_PROVIDER }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_STORAGE_BUCKET: ${{ vars.SUPABASE_STORAGE_BUCKET }}
      SUPABASE_BUCKET_PUBLIC: ${{ vars.SUPABASE_BUCKET_PUBLIC }}
      RAZORPAY_KEY_ID: ${{ vars.RAZORPAY_KEY_ID }}
      MSG91_TEMPLATE_ID: ${{ vars.MSG91_TEMPLATE_ID }}
      OTP_BYPASS_ENABLED: ${{ vars.OTP_BYPASS_ENABLED }}
      ENABLE_SCHEDULER: ${{ vars.ENABLE_SCHEDULER }}
      ENABLE_NOTIFICATIONS_WORKER: ${{ vars.ENABLE_NOTIFICATIONS_WORKER }}
      CORS_ORIGINS: ${{ vars.CORS_ORIGINS }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ vars.NODE_VERSION || '20' }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint if present
        run: npm run lint --if-present

      - name: Run tests if present
        run: npm test --if-present

      - name: Run build if present
        run: npm run build --if-present

      - name: Debug GitHub deploy inputs
        run: |
          echo "Repository: ${{ github.repository }}"
          echo "Ref: ${{ github.ref }}"
          echo "Environment: dev"
          echo "GCP project: ${{ vars.GCP_PROJECT_ID }}"
          echo "Region: ${{ vars.GCP_REGION }}"
          echo "Cloud Run service: ${{ vars.CLOUD_RUN_SERVICE }}"
          echo "Has GCP_SERVICE_ACCOUNT secret: ${{ secrets.GCP_SERVICE_ACCOUNT != '' }}"
          echo "Has GCP_WORKLOAD_IDENTITY_PROVIDER secret: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER != '' }}"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Deploy Cloud Run
        run: bash src/scripts/deploy-cloudrun.sh

      - name: Deploy Firebase Hosting
        run: bash src/scripts/deploy-firebase-hosting.sh