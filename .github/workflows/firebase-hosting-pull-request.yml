name: Firebase Hosting Preview (static only)
on:
  pull_request:
    paths:
      - firebase.json
      - public/**
      - .github/workflows/firebase-hosting-pull-request.yml
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FRESCA_F3184 }}
          projectId: fresca-f3184
